<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div class="container">
        <div class="side">
            <h2 class="name">Toda</h2>

            <button type="button" class="open-project-dialog">+ Add Project</button>

            <dialog class="project-dialog">
                <form  id="project-form">
                   
                    <input type="text" name="project" id="project-name" placeholder="Project Name">

                    <button type="submit" class="add-project">Add Project</button>
                    <button type="button" class="close-project-dialog">Close</button>
                </form>
            </dialog>

            <div class="projects"></div>

        </div>

        <div class="main">
            <div class="text">
                <h1>Add Your Todos</h1>
            </div>
              <button type="button" class="open-todo-dialog">Add Todo</button>

            <div class="todo-dialog-form">
              
                <dialog class="todo-dialog">
                    <form id="dialog-form">
                      
                        <input type="text" name="title" id="title" placeholder="title">

                        <input type="text" name="description" id="desc" placeholder="description">

                        <label for="date">Date</label>
                        <input type="date" name="dueDate" id="date">

                        <label for="priority">Priority</label>
                        <select name="priority" id="priority" >
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>

                        <textarea name="notes" id="notes" placeholder="notes"></textarea>

                        <button type="submit" class="add-todo">Add todo</button>
                        <button type="button" class="close-todo-dialog">Close</button>
                    </form>
                </dialog>
                
                <div class="todos"></div>
            </div>
        </div>
    </div>
</body>
</html>
